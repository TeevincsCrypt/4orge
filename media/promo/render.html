<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:G;src:url(assets/Geist-Regular.woff2);font-weight:400}
@font-face{font-family:G;src:url(assets/Geist-Medium.woff2);font-weight:500}
@font-face{font-family:G;src:url(assets/Geist-SemiBold.woff2);font-weight:600}
@font-face{font-family:G;src:url(assets/Geist-Bold.woff2);font-weight:700}
@font-face{font-family:G;src:url(assets/Geist-Black.woff2);font-weight:900}
:root{--blue:#3d89e9;--blue2:#5aa2ff;--ink:#07070b;--paper:#f3f3f9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:G,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
.serif{font-family:"Bitstream Charter",Charter,"Caladea",serif;font-style:italic;font-weight:400;letter-spacing:-0.01em}
.mono{font-family:"JetBrains Mono",monospace}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
.layer{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.abs{position:absolute}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content}
.leak{position:absolute;border-radius:50%;pointer-events:none}
#grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.22;pointer-events:none}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px);opacity:0;pointer-events:none}
.card{position:absolute;border-radius:18px;padding:22px 26px;font-size:26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.term{background:#0d0f16;border:1px solid #23283a;color:#cfd6ea;width:560px}
.term .bar{display:flex;gap:8px;margin-bottom:14px}.term .bar i{width:12px;height:12px;border-radius:50%;background:#3a3f52;display:block}
.toast{background:#1a0b10;border:1px solid #ff3b6b66;color:#ff8fa8}
.chip{position:absolute;display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:12px 22px;font-size:26px;font-weight:500;white-space:nowrap}
.chip.dark{background:#11131c;border:1px solid #2a3046;color:#e8ecf8}
.chip.light{background:#fff;color:#16161d;box-shadow:0 10px 30px -12px rgba(30,40,90,.35)}
.ok{color:#33d17a}
.tile{background:#fff;border-radius:44px;display:flex;align-items:center;justify-content:center}
.gridline{position:absolute;background:rgba(255,255,255,.12)}
.cell{position:absolute;overflow:hidden;border-radius:6px}
.cell img{position:absolute;left:0;top:0;width:100%;height:auto;transform-origin:0 0}
.blob{position:absolute;border-radius:50%}
.plus{position:absolute;width:90px;height:90px}
.plus:before,.plus:after{content:"";position:absolute;background:linear-gradient(135deg,#7fb6ff,#2f6fe0);border-radius:10px}
.plus:before{left:32px;top:0;width:26px;height:90px}.plus:after{top:32px;left:0;height:26px;width:90px}
.step{position:absolute;background:#fff;color:#16161d;border-radius:20px;padding:20px 26px;display:flex;align-items:center;gap:16px;font-size:28px;font-weight:500;box-shadow:0 30px 60px -24px rgba(40,40,90,.45);white-space:nowrap}
.pill{font-size:18px;border-radius:999px;padding:5px 14px;font-weight:600}
.check{width:34px;height:34px;border-radius:50%;border:3px solid #1f9d63;display:inline-flex;align-items:center;justify-content:center;color:#1f9d63;font-size:20px;font-weight:800}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg"></div>
  <div class="layer" id="leaks"></div>
  <div id="scenes"></div>
  <div id="scan"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="480" height="270"></canvas>
  <div id="flash"></div>
</div>
<script>
const BPM = 128, B = 60 / BPM, S = (b) => b * B;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eo = (t) => 1 - Math.pow(1 - t, 3);                 // ease out cubic
const eoe = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)); // ease out expo
const eib = (t) => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }; // ease out back
const prog = (t, b0, b1) => clamp((t - S(b0)) / (S(b1) - S(b0)));
function rnd(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash = (n) => rnd(n * 9973 + 17)();
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
const scenesEl = document.getElementById("scenes");
const MARK = (size, id) => `<svg viewBox="100 334 632 574" width="${size}" height="${size * 574 / 632}"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#7b7d83"/><stop offset=".45" stop-color="#55585f"/><stop offset="1" stop-color="#383b44"/></linearGradient></defs><path fill="url(#g${id})" stroke="#2e3036" stroke-width="3" fill-rule="evenodd" d="M408 338 L408 852 L359 905 L358 702 L103 702 Z M358 478 L358 645 L215 645 Z"/><path fill="#3d89e9" d="M452 408 L728 408 L690 461 L502 461 L502 550 L452 600 Z"/><path fill="#3d89e9" d="M452 647 L507 592 L609 592 L632 548 L688 548 L639 646 L502 646 L502 755 L409 855 L409 778 L452 735 Z"/></svg>`;
const rgb = (px, a = .85) => px ? `${px}px 0 rgba(255,40,90,${a}), ${-px}px 0 rgba(40,200,255,${a})` : "none";

// ------------------------------------------------------------------ global FX
const leaks = document.getElementById("leaks");
const LEAKS = [0, 1, 2, 3].map((i) => { const d = $(`<div class="leak"></div>`); leaks.appendChild(d); return d; });
function setLeaks(t, intensity, palette = "blue") {
  const cols = palette === "blue" ? ["61,137,233", "110,120,255", "150,200,255", "40,90,220"] : ["251,228,236", "221,233,251", "236,230,248", "200,220,255"];
  LEAKS.forEach((d, i) => {
    const r = 700 + 300 * Math.sin(t * 0.7 + i);
    const x = 960 + 700 * Math.sin(t * (0.35 + i * 0.13) + i * 2) - r;
    const y = 540 + 420 * Math.cos(t * (0.29 + i * 0.11) + i) - r;
    d.style.cssText = `width:${r * 2}px;height:${r * 2}px;left:${x}px;top:${y}px;background:radial-gradient(circle, rgba(${cols[i]},${0.55 * intensity}) 0%, rgba(${cols[i]},${0.18 * intensity}) 35%, transparent 68%)`;
  });
}
const grain = document.getElementById("grain"), gctx = grain.getContext("2d");
function drawGrain(frame, amount) {
  const img = gctx.createImageData(480, 270), r = rnd(frame + 1);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  gctx.putImageData(img, 0, 0); grain.style.opacity = amount;
}

// ------------------------------------------------------------------ scenes
const SCENES = [];
function scene(b0, b1, build, update) { const el = $(`<div class="scene"></div>`); scenesEl.appendChild(el); const ctx = build(el) || {}; SCENES.push({ b0, b1, el, ctx, update }); }

// A — intro words + "chaos."
scene(0, 8, (el) => {
  el.style.background = "transparent";
  const words = [["Shipping", 0], ["a", 1], ["smart", 1.5], ["contract", 2], ["used", 3], ["to", 3.5], ["be…", 4]];
  const line1 = $(`<div class="center" style="top:46%;font-size:118px;font-weight:500;letter-spacing:-0.04em;white-space:nowrap"></div>`);
  const spans = words.map(([w, b]) => { if (w === "used") line1.appendChild(document.createElement("br")); const s = $(`<span style="display:inline-block;margin:0 14px">${w}</span>`); line1.appendChild(s); return [s, b]; });
  line1.style.textAlign = "center"; line1.style.lineHeight = "1.15";
  el.appendChild(line1);
  const chaos = [];
  for (let i = 0; i < 7; i++) {
    const c = $(`<div class="center serif" style="font-size:380px;line-height:1;white-space:nowrap;color:${i ? "#fff" : "#fff"}">chaos.</div>`);
    if (i) c.style.clipPath = `inset(${(i - 1) * 16.6}% 0 ${100 - i * 16.6}% 0)`;
    el.appendChild(c); chaos.push(c);
  }
  return { line1, spans, chaos };
}, (t, ctx, f) => {
  const showWords = t < S(5);
  ctx.line1.style.display = showWords ? "block" : "none";
  ctx.spans.forEach(([s, b]) => {
    const p = prog(t, b, b + 0.5);
    s.style.opacity = p > 0 ? 1 : 0;
    s.style.filter = `blur(${(1 - eoe(p)) * 22}px)`;
    s.style.transform = `translateY(${(1 - eoe(p)) * 60}px) scale(${1 + (1 - eoe(p)) * 0.4})`;
    s.style.textShadow = rgb(p < 0.35 && p > 0 ? 10 * (1 - p / 0.35) : 0);
  });
  const cp = prog(t, 5, 5.5);
  ctx.chaos.forEach((c, i) => {
    c.style.display = t >= S(5) ? "block" : "none";
    const jit = t < S(7.5) ? (i ? (hash(f * 7 + i) - 0.5) * 90 * (hash(f + i * 31) > 0.45 ? 1 : 0.15) : 0) : 0;
    const zoom = 1.6 - 0.6 * eoe(cp) + prog(t, 5.5, 8) * 0.25 + Math.pow(prog(t, 7.2, 8), 3) * 6;
    c.style.transform = `translate(calc(-50% + ${jit}px), -50%) scale(${zoom}) skewX(${(hash(f + 3) - 0.5) * 14 * (1 - cp)}deg)`;
    c.style.textShadow = i === 0 ? rgb(14 + 18 * hash(f)) : "none";
    c.style.opacity = i === 0 ? 1 : 0.95;
    c.style.color = i && hash(f * 3 + i) > 0.85 ? "#3d89e9" : "#fff";
    c.style.filter = `blur(${(1 - cp) * 30 + Math.pow(prog(t, 7.2, 8), 2) * 40}px)`;
  });
});

// B — chaos montage (8-14), then "So we forged it." on white (14-16)
const CARDS = [
  ["term", `<div class="bar"><i></i><i></i><i></i></div><div class="mono" style="font-size:24px;line-height:1.6">$ npm install<br><span style="color:#f5c26b">npm WARN deprecated</span><br><span style="color:#f5c26b">npm WARN deprecated</span><br><span style="color:#ff6b8b">npm ERR! peer dep conflict</span></div>`],
  ["toast", `<b>Error HH8</b><br><span class="mono" style="font-size:22px">invalid hardhat.config</span>`],
  ["term", `<div class="bar"><i></i><i></i><i></i></div><div class="mono" style="font-size:26px">solc <span style="color:#ff6b8b">0.8.??</span> — which one?</div>`],
  ["toast", `<b>insufficient funds for gas</b>`],
  ["toast", `<b>wrong chain id</b><br><span class="mono" style="font-size:22px">got 1 · expected 1983</span>`],
  ["term", `<div class="bar"><i></i><i></i><i></i></div><div class="mono" style="font-size:26px;color:#ff6b8b">RPC timeout ⏱</div>`],
  ["term", `<div class="bar"><i></i><i></i><i></i></div><div class="mono" style="font-size:24px">tx 0x9f3a…c41 <span style="color:#f5c26b">pending…</span><br><span style="color:#8a90a8">pending…</span><br><span style="color:#5d6378">pending…</span></div>`],
  ["toast", `<b>invalid opcode: PUSH0</b>`],
  ["term", `<div class="bar"><i></i><i></i><i></i></div><div class="mono" style="font-size:22px;line-height:1.7">addresses_final_v3.xlsx<br>0x5fb…aa3 · testnet? mainnet?<br>0x9e5…1b2 · ???</div>`],
  ["toast", `<b>did the tests even run?</b>`],
  ["term", `<div class="bar"><i></i><i></i><i></i></div><div class="mono" style="font-size:26px">deploy (copy) (2).js</div>`],
  ["toast", `<b>which network was that??</b>`],
];
const BIGWORDS = ["npm", "solc", "RPC", "gas", "chainId", "ABI", "nonce", "PUSH0", "revert", "0x??", "ERR!", "help"];
scene(8, 16, (el) => {
  const big = $(`<div class="center" style="font-size:520px;font-weight:900;letter-spacing:-0.06em;color:transparent;-webkit-text-stroke:4px rgba(255,255,255,.22);white-space:nowrap"></div>`);
  el.appendChild(big);
  const cards = CARDS.map(([kind, html], i) => {
    const r = rnd(100 + i);
    const c = $(`<div class="card ${kind}">${html}</div>`);
    c.dataset.x = 60 + r() * 1150; c.dataset.y = 40 + r() * 700; c.dataset.rot = (r() - 0.5) * 24;
    el.appendChild(c); return c;
  });
  const white = $(`<div class="layer" style="background:#f3f3f9"></div>`);
  const line = $(`<div class="center" style="font-size:150px;font-weight:500;letter-spacing:-0.045em;color:#16161d;white-space:nowrap"><span style="margin-right:.22em">So we</span><span class="serif" style="color:#3d89e9;font-size:170px;margin-right:.18em">forged</span><span>it.</span></div>`);
  white.appendChild(line); el.appendChild(white);
  return { big, cards, white, line, parts: [...line.children] };
}, (t, ctx, f) => {
  const k = Math.floor((t - S(8)) / S(0.5));
  ctx.big.textContent = BIGWORDS[clamp(k, 0, 11)];
  ctx.big.style.transform = `translate(-50%,-50%) scale(${1.15 - 0.15 * eoe(((t - S(8)) % S(0.5)) / S(0.5))}) rotate(${(hash(k) - 0.5) * 8}deg)`;
  ctx.big.style.webkitTextStroke = `3px ${k % 2 ? "rgba(61,137,233,.55)" : "rgba(255,59,107,.35)"}`;
  ctx.cards.forEach((c, i) => {
    const b = 8 + i * 0.5, p = prog(t, b, b + 0.35);
    const vis = t >= S(b) && t < S(14);
    c.style.display = vis ? "block" : "none";
    const sc = 1.5 - 0.5 * eib(p);
    c.style.transform = `translate(${+c.dataset.x + (hash(f * 13 + i) - 0.5) * 22}px, ${+c.dataset.y + (hash(f * 17 + i) - 0.5) * 22}px) rotate(${+c.dataset.rot + (hash(f * 19 + i) - 0.5) * 3}deg) scale(${sc * 1.45})`;
    c.style.filter = `blur(${(1 - p) * 14}px)`;
    c.style.opacity = vis ? 1 : 0;
  });
  // white "So we forged it."
  const w = t >= S(14);
  ctx.white.style.display = w ? "block" : "none";
  [[0, 14], [1, 14.5], [2, 15]].forEach(([i, b]) => {
    const p = prog(t, b, b + 0.4), s = ctx.parts[i];
    s.style.opacity = p > 0 ? 1 : 0;
    s.style.display = "inline-block";
    s.style.filter = `blur(${(1 - eoe(p)) * 18}px)`;
    s.style.transform = `translateY(${(1 - eoe(p)) * 40}px)`;
  });
  ctx.line.style.transform = `translate(-50%,-50%) scale(${1 + Math.pow(prog(t, 15, 16), 3) * 0.6})`;
});

// C — DROP: logo slam, shockwave, particles, wordmark assembly, tagline
scene(16, 24, (el) => {
  const tile = $(`<div class="tile center" style="width:300px;height:300px;box-shadow:0 0 120px 30px rgba(61,137,233,.55),0 40px 80px -20px rgba(0,0,0,.6)">${MARK(210, "a")}</div>`);
  const ring = $(`<div class="center" style="width:300px;height:300px;border-radius:50%;border:6px solid rgba(120,180,255,.9)"></div>`);
  const ring2 = $(`<div class="center" style="width:300px;height:300px;border-radius:50%;border:3px solid rgba(255,255,255,.7)"></div>`);
  el.append(ring, ring2);
  const parts = [];
  for (let i = 0; i < 46; i++) { const r = rnd(500 + i); const s = 6 + r() * 22; const p = $(`<div class="abs" style="width:${s}px;height:${s}px;border-radius:${r() > .5 ? "50%" : "3px"};background:${r() > .35 ? "#5aa2ff" : "#fff"}"></div>`); p.dataset.a = r() * Math.PI * 2; p.dataset.v = 500 + r() * 1100; el.appendChild(p); parts.push(p); }
  el.appendChild(tile);
  const word = $(`<div class="abs" style="left:0;top:0;font-size:150px;font-weight:700;letter-spacing:0.04em;white-space:nowrap"></div>`);
  const letters = ["4", "O", "R", "G", "E"].map((ch, i) => { const s = $(`<span style="display:inline-block;color:${i ? "#3d89e9" : "#fff"}">${ch}</span>`); word.appendChild(s); return s; });
  el.appendChild(word);
  const tag = $(`<div class="abs" style="left:0;right:0;top:770px;text-align:center;font-size:72px;font-weight:500;letter-spacing:-0.03em;white-space:nowrap"></div>`);
  const tw = [["Compile.", 20], ["Test.", 21], ["Deploy.", 22], ["on QIE.", 23]].map(([w, b], i) => { const s = $(`<span class="${i === 3 ? "serif" : ""}" style="display:inline-block;margin:0 16px;${i === 3 ? "color:#5aa2ff;font-size:84px" : ""}">${w}</span>`); s.dataset.b = b; tag.appendChild(s); return s; });
  el.appendChild(tag);
  return { tile, ring, ring2, parts, word, letters, tw };
}, (t, ctx, f) => {
  const p = prog(t, 16, 16.6);
  const assemble = prog(t, 18, 19.2);
  // tile moves left when wordmark assembles
  const tx = lerp(0, -330, eo(assemble)), ty = lerp(0, -80, eo(assemble));
  const sc = (t < S(16) ? 0 : 3.2 - 2.2 * eib(p)) * lerp(1, 0.72, eo(assemble));
  ctx.tile.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${sc}) rotate(${(1 - eoe(p)) * -18}deg)`;
  ctx.tile.style.filter = `blur(${(1 - eoe(p)) * 26}px)`;
  const rp = prog(t, 16, 17.2);
  ctx.ring.style.transform = `translate(-50%,-50%) scale(${1 + eo(rp) * 7})`; ctx.ring.style.opacity = 1 - rp;
  const rp2 = prog(t, 16.15, 17.6);
  ctx.ring2.style.transform = `translate(-50%,-50%) scale(${1 + eo(rp2) * 9})`; ctx.ring2.style.opacity = (1 - rp2) * 0.8;
  const pp = prog(t, 16, 17.8);
  ctx.parts.forEach((d) => { const a = +d.dataset.a, v = +d.dataset.v * eo(pp); d.style.transform = `translate(${960 + Math.cos(a) * v}px, ${540 + Math.sin(a) * v}px) rotate(${pp * 400}deg)`; d.style.opacity = 1 - pp; });
  // wordmark letters fly from scatter into place
  const base = { x: 960 - 140 + -0, y: 540 - 160 };
  ctx.letters.forEach((s, i) => {
    const r = rnd(900 + i), q = eo(prog(t, 18 + i * 0.12, 19 + i * 0.12));
    const fx = (r() - 0.5) * 1800, fy = (r() - 0.5) * 1000, fr = (r() - 0.5) * 220;
    s.style.transform = `translate(${fx * (1 - q)}px, ${fy * (1 - q)}px) rotate(${fr * (1 - q)}deg) scale(${1 + (1 - q) * 1.5})`;
    s.style.opacity = t >= S(18) ? 1 : 0;
    s.style.filter = `blur(${(1 - q) * 16}px)`;
  });
  ctx.word.style.transform = `translate(${base.x - 70}px, ${base.y + 0}px)`;
  ctx.tw.forEach((s) => { const q = prog(t, +s.dataset.b, +s.dataset.b + 0.35); s.style.opacity = q > 0 ? 1 : 0; s.style.transform = `scale(${1.8 - 0.8 * eib(q)})`; s.style.filter = `blur(${(1 - q) * 12}px)`; s.style.textShadow = rgb(q > 0 && q < 0.4 ? 8 : 0); });
});

// D — feature grid: Compile / Test / Review / Sign (24-40)
const FEATURES = [
  { word: "Compile", sub: "with the <i>real</i> solc", img: ["build", "dashboard", "tests"], chips: ["solc 0.8.28 ✓", "OpenZeppelin ✓", "0 errors"] },
  { word: "Test", sub: "in a <i>sandbox</i>", img: ["tests", "build", "execution"], chips: ["6 passed", "0 failed", "fuzz · 256 runs"] },
  { word: "Review", sub: "before <i>anything</i> is sent", img: ["execution-review", "deploy-wizard", "dashboard"], chips: ["chain 1983 ✓", "gas 207,404", "args type-checked"] },
  { word: "Sign", sub: "with <i>your</i> wallet", img: ["deploy-wizard", "execution-success", "execution"], chips: ["MetaMask", "Rabby", "keys never leave your wallet"] },
];
const LAYOUTS = [
  { cells: [[60, 60, 960, 420], [1100, 90, 760, 430], [1100, 570, 760, 440]], word: [90, 640] },
  { cells: [[60, 560, 820, 460], [1000, 60, 860, 420], [60, 60, 560, 440]], word: [1010, 640] },
  { cells: [[1060, 60, 800, 960], [60, 60, 960, 380], [720, 470, 300, 260]], word: [80, 640] },
  { cells: [[60, 60, 1000, 520], [1180, 60, 680, 560], [60, 680, 500, 340]], word: [620, 760] },
];
scene(24, 40, (el) => {
  const g = [];
  [[0.33, "v"], [0.58, "v"], [0.5, "h"], [0.22, "h"], [0.8, "h"]].forEach(([p, d]) => { const l = $(`<div class="gridline"></div>`); l.style.cssText += d === "v" ? `left:${p * 1920}px;top:0;width:1px;height:1080px` : `top:${p * 1080}px;left:0;height:1px;width:1920px`; el.appendChild(l); g.push(l); });
  const blobs = [];
  for (let i = 0; i < 5; i++) { const b = i % 2 ? $(`<div class="plus"></div>`) : $(`<div class="blob" style="width:${120 + i * 30}px;height:${120 + i * 30}px;background:radial-gradient(circle at 35% 30%,#9cc6ff,#2f6fe0 55%,#1b3f99)"></div>`); el.appendChild(b); blobs.push(b); }
  const cells = [0, 1, 2].map(() => { const c = $(`<div class="cell"><img></div>`); el.appendChild(c); return c; });
  const word = $(`<div class="abs" style="font-size:190px;font-weight:600;letter-spacing:-0.05em;line-height:1"></div>`);
  const sub = $(`<div class="abs serif" style="font-size:64px;color:#b9d3f5"></div>`);
  el.append(word, sub);
  const chips = [0, 1, 2].map(() => { const c = $(`<div class="chip dark"></div>`); el.appendChild(c); return c; });
  return { g, blobs, cells, word, sub, chips };
}, (t, ctx, f) => {
  const i = clamp(Math.floor((t - S(24)) / S(4)), 0, 3), F = FEATURES[i], Lo = LAYOUTS[i], b0 = 24 + i * 4;
  const inP = prog(t, b0, b0 + 0.6);
  const whip = Math.pow(prog(t, b0 + 3.75, b0 + 4), 2);
  const kickPunch = 1 + 0.025 * Math.exp(-((t - S(Math.floor(t / B))) / 0.08));
  ctx.word.innerHTML = F.word; ctx.sub.innerHTML = F.sub.replace(/<i>(.*?)<\/i>/, '<span style="color:#fff">$1</span>');
  ctx.word.style.transform = `translate(${Lo.word[0] + (1 - eoe(inP)) * -300 - whip * 900}px, ${Lo.word[1] - 120}px) scale(${kickPunch})`;
  ctx.word.style.filter = `blur(${(1 - eoe(inP)) * 20 + whip * 30}px)`;
  ctx.word.style.textShadow = rgb(inP < 0.3 ? 12 : 0);
  ctx.sub.style.transform = `translate(${Lo.word[0] + 8 - whip * 900}px, ${Lo.word[1] + 90}px)`;
  ctx.sub.style.opacity = prog(t, b0 + 0.5, b0 + 1);
  ctx.cells.forEach((c, k) => {
    const [x, y, w, h] = Lo.cells[k], cp = prog(t, b0 + k * 0.5, b0 + k * 0.5 + 0.5);
    c.style.left = x + "px"; c.style.top = y + "px"; c.style.width = w + "px"; c.style.height = h + "px";
    c.style.clipPath = `inset(0 ${100 - eoe(cp) * 100}% 0 0 round 14px)`;
    const img = c.firstElementChild; const src = `assets/${F.img[k]}.png`;
    if (!img.src.endsWith(src)) img.src = src;
    const kb = prog(t, b0, b0 + 4);
    img.style.width = (w * 2.1) + "px";
    img.style.transform = `translate(${-w * (0.18 + 0.25 * kb) - k * 60}px, ${-60 - 160 * kb - k * 70}px) scale(${1.0 + 0.1 * kb})`;
    c.style.transform = `translateX(${-whip * 900}px)`;
    c.style.boxShadow = "0 30px 60px -20px rgba(0,0,0,.7)";
  });
  ctx.chips.forEach((c, k) => {
    const cb = b0 + 1 + k * 0.5, cp = prog(t, cb, cb + 0.3);
    c.innerHTML = F.chips[k].replace("✓", '<span class="ok">✓</span>');
    const prevW = k ? ctx.chips.slice(0, k).reduce((a, x) => a + x.offsetWidth + 16, 0) : 0;
    c.style.left = (Lo.word[0] + 8 + prevW) + "px"; c.style.top = (Lo.word[1] + 190) + "px";
    c.style.transformOrigin = "left center";
    c.style.opacity = cp > 0 ? 1 : 0;
    c.style.transform = `scale(${1.6 - 0.6 * eib(cp)}) translateX(${-whip * 900}px)`;
  });
  ctx.blobs.forEach((b, k) => { const r = rnd(70 + k + i * 10); b.style.transform = `translate(${(Lo.word[0] > 500 ? 80 : 1000) + r() * 750 + Math.sin(t * 1.3 + k) * 80}px, ${40 + r() * 420 + Math.cos(t * 1.1 + k) * 60}px) rotate(${t * 40 * (k % 2 ? 1 : -1)}deg) scale(${0.6 + r() * 0.6})`; b.style.filter = `blur(${k % 3 === 0 ? 6 : 0}px)`; b.style.opacity = 0.9; });
  ctx.g.forEach((l, k) => { l.style.transform = `translate(${Math.sin(t + k) * 12}px, ${Math.cos(t * 1.2 + k) * 10}px)`; });
});

// E — receipts (40-48)
const CHECKS = ["Contract creation", "Approved deployer", "Bytecode match", "Status: success", "Code at address"];
scene(40, 48, (el) => {
  const hash = $(`<div class="abs mono" style="left:-200px;top:120px;font-size:120px;color:rgba(255,255,255,.05);white-space:nowrap;line-height:1.3">0xb0b2ae693b90924ee9cd1db97989dd43fe3963c3ea3e424cbaaa500e538bb05e<br>0x5fbdb2315678afecb367f032d93f642f64180aa3 · block 1 · chain 1983<br>0xb0b2ae693b90924ee9cd1db97989dd43fe3963c3ea3e424cbaaa500e538bb05e</div>`);
  el.appendChild(hash);
  const title = $(`<div class="abs" style="left:140px;top:170px;font-size:120px;font-weight:500;letter-spacing:-0.045em;white-space:nowrap"><span>Receipts,</span> <span class="serif" style="color:#5aa2ff;font-size:132px">not promises.</span></div>`);
  el.appendChild(title);
  const rows = CHECKS.map((c, i) => { const r = $(`<div class="abs" style="left:160px;top:${400 + i * 108}px;display:flex;align-items:center;gap:26px;font-size:62px;font-weight:500;white-space:nowrap"><span class="check" style="width:62px;height:62px;font-size:34px;border-color:#33d17a;color:#33d17a">✓</span>${c}</div>`); el.appendChild(r); return r; });
  const white = $(`<div class="layer" style="background:#f3f3f9"></div>`);
  const ver = $(`<div class="center" style="font-size:330px;font-weight:900;letter-spacing:-0.06em;color:#3d89e9;white-space:nowrap">VERIFIED</div>`);
  const on = $(`<div class="center serif" style="font-size:90px;color:#16161d;white-space:nowrap">on-chain.</div>`);
  white.append(ver, on); el.appendChild(white);
  return { hash, title, parts: [...title.children], rows, white, ver, on };
}, (t, ctx, f) => {
  ctx.hash.style.transform = `translateX(${-((t - S(40)) * 260)}px)`;
  ctx.parts.forEach((s, i) => { const q = prog(t, 40 + i, 40.4 + i); s.style.display = "inline-block"; s.style.opacity = q > 0 ? 1 : 0; s.style.filter = `blur(${(1 - eoe(q)) * 18}px)`; s.style.transform = `translateY(${(1 - eoe(q)) * 40}px)`; });
  [42, 43, 44, 45, 45.5].forEach((b, i) => { const q = prog(t, b, b + 0.3), r = ctx.rows[i]; r.style.opacity = q > 0 ? 1 : 0; r.style.transform = `scale(${1.5 - 0.5 * eib(q)}) translateX(${(1 - q) * -40}px)`; r.style.transformOrigin = "left center"; });
  const w = t >= S(46);
  ctx.white.style.display = w ? "block" : "none";
  const vp = prog(t, 46, 46.7), out = Math.pow(prog(t, 47.4, 48), 2);
  ctx.ver.style.transform = `translate(-50%,-58%) scaleX(${3.2 - 2.2 * eoe(vp) + out * 2}) scaleY(${0.4 + 0.6 * eoe(vp)}) skewX(${(1 - vp) * -25}deg)`;
  ctx.ver.style.filter = `blur(${(1 - eoe(vp)) * 26 + out * 30}px)`;
  ctx.on.style.transform = `translate(-50%, 160px)`; ctx.on.style.opacity = prog(t, 46.6, 47) * (1 - out);
});

// F — Runbooks on white (48-56)
const YAML = `schema: 4orge.runbook/v1\nname: Deploy QieToken\nnetwork: qie-testnet\nsteps:\n  - { id: load,    uses: project.load }\n  - { id: network, uses: network.check }\n  - { id: compile, uses: contracts.compile }\n  - { id: test,    uses: contracts.test }\n  - { id: prepare, uses: deploy.prepare }\n  - { id: confirm, uses: human.confirm }\n  - { id: sign,    uses: wallet.deploy }\n  - { id: receipt, uses: tx.confirm }\n  - { id: verify,  uses: contract.verify }`;
const STEPS = [["Compile contracts", "Local build", "#e5eefc", "#2360b8"], ["Run tests", "Local build", "#e5eefc", "#2360b8"], ["Your review", "Human", "#fdf1dc", "#8a5a12"], ["Wallet signs", "Wallet", "#fbe4ec", "#a92f53"], ["Confirmed on-chain", "Automated", "#ededf5", "#6c6c80"], ["Report generated", "Automated", "#ededf5", "#6c6c80"]];
scene(48, 56, (el) => {
  const bg = $(`<div class="layer" style="background:radial-gradient(ellipse 50% 60% at 10% 0%,#fbe4ec,transparent 70%),radial-gradient(ellipse 50% 70% at 90% 10%,#dde9fb,transparent 70%),#f3f3f9"></div>`);
  el.appendChild(bg);
  const code = $(`<pre class="abs mono" style="left:-120px;top:0;font-size:46px;line-height:1.5;color:rgba(22,22,29,.09);transform-origin:0 0;white-space:pre"></pre>`);
  code.textContent = (YAML + "\n\n").repeat(4); el.appendChild(code);
  const title = $(`<div class="abs" style="left:130px;top:150px;color:#16161d;font-size:170px;font-weight:600;letter-spacing:-0.05em;line-height:1">Runbooks</div>`);
  const sub = $(`<div class="abs serif" style="left:136px;top:350px;color:#2a6fcc;font-size:72px;white-space:nowrap">write it once. run it forever.</div>`);
  el.append(title, sub);
  const cards = STEPS.map(([n, c, bgc, fg], i) => { const s = $(`<div class="step"><span class="check">✓</span><span>${n}</span><span class="pill" style="background:${bgc};color:${fg}">${c}</span></div>`); el.appendChild(s); return s; });
  const stat = $(`<div class="center" style="color:#16161d;text-align:center;white-space:nowrap"><div class="n" style="font-size:420px;font-weight:700;letter-spacing:-0.06em;line-height:.9;color:#3d89e9"></div><div class="l serif" style="font-size:90px"></div></div>`);
  const statBg = $(`<div class="layer" style="background:#f3f3f9"></div>`);
  el.append(statBg, stat);
  return { code, title, sub, cards, stat, statBg };
}, (t, ctx, f) => {
  ctx.code.style.transform = `rotate(-12deg) translate(${-(t - S(48)) * 120}px, ${-(t - S(48)) * 260}px)`;
  const tq = prog(t, 48, 48.5), sq = prog(t, 49, 49.5);
  ctx.title.style.transform = `translateY(${(1 - eoe(tq)) * 120}px)`; ctx.title.style.opacity = tq > 0 ? 1 : 0; ctx.title.style.filter = `blur(${(1 - eoe(tq)) * 20}px)`;
  ctx.sub.style.opacity = sq; ctx.sub.style.transform = `translateX(${(1 - eoe(sq)) * -60}px)`;
  ctx.cards.forEach((c, i) => {
    const q = eo(prog(t, 48.5 + i * 0.4, 50 + i * 0.4)), r = rnd(300 + i);
    const tx = 1080 + r() * 260, ty = 150 + i * 135;
    c.style.transform = `translate(${lerp(2100, tx, q)}px, ${lerp(1200, ty, q) + Math.sin(t * 2 + i) * 10}px) rotate(${lerp(40 + r() * 40, (r() - 0.5) * 10, q)}deg) scale(${lerp(1.6, 1, q)})`;
  });
  const statOn = t >= S(52) && t < S(55.5);
  ctx.stat.style.display = ctx.statBg.style.display = statOn ? "block" : "none";
  if (statOn) {
    const k = clamp(Math.floor((t - S(52)) / B), 0, 2), q = prog(t, 52 + k, 52.35 + k);
    const data = [["13", "allowlisted steps"], ["0", "private keys stored"], ["1", "workspace"]][k];
    const spinning = q < 0.6; ctx.stat.querySelector(".n").textContent = spinning ? String(Math.floor(hash(f) * 99)) : data[0];
    ctx.stat.querySelector(".l").textContent = data[1];
    ctx.stat.style.transform = `translate(-50%,-50%) scale(${1.4 - 0.4 * eib(q)})`;
    ctx.stat.querySelector(".n").style.textShadow = spinning ? rgb(10, 0.6) : "none";
  }
});

// G — outro (56-64): scattered letters → "built for QIE." → logo lockup → Try it now.
scene(56, 68, (el) => {
  const phrase = "built for QIE.";
  const wrap = $(`<div class="center" style="font-size:150px;font-weight:500;letter-spacing:-0.04em;white-space:pre"></div>`);
  const ls = [...phrase].map((ch, i) => { const s = $(`<span style="display:inline-block;${i >= 10 ? "color:#5aa2ff" : ""}">${ch}</span>`); wrap.appendChild(s); return s; });
  el.appendChild(wrap);
  const blobs = [];
  for (let i = 0; i < 6; i++) { const b = i % 3 === 1 ? $(`<div class="plus"></div>`) : $(`<div class="blob" style="width:${90 + i * 25}px;height:${90 + i * 25}px;background:radial-gradient(circle at 35% 30%,#9cc6ff,#2f6fe0 55%,#1b3f99)"></div>`); el.appendChild(b); blobs.push(b); }
  const lock = $(`<div class="center" style="display:flex;align-items:center;gap:56px"><div class="tile" style="width:230px;height:230px;border-radius:52px;box-shadow:0 0 140px 30px rgba(61,137,233,.45)">${MARK(160, "b")}</div><div style="font-size:170px;font-weight:700;letter-spacing:0.04em;white-space:nowrap">4<span style="color:#3d89e9">ORGE</span></div></div>`);
  const tag = $(`<div class="abs" style="left:0;right:0;top:720px;text-align:center;font-size:56px;color:#c9d6f2;white-space:nowrap">Compile, test &amp; deploy on QIE — from one workspace.</div>`);
  const cta = $(`<div class="abs serif" style="left:0;right:0;top:820px;text-align:center;font-size:96px;color:#fff;white-space:nowrap">Try it now.</div>`);
  el.append(lock, tag, cta);
  return { wrap, ls, blobs, lock, tag, cta };
}, (t, ctx, f) => {
  const asm = eo(prog(t, 56, 59.2)), hide = t >= S(60);
  ctx.wrap.style.display = hide ? "none" : "block";
  ctx.ls.forEach((s, i) => { const r = rnd(1200 + i); const fx = (r() - 0.5) * 1700, fy = (r() - 0.5) * 900; s.style.transform = `translate(${fx * (1 - asm)}px, ${fy * (1 - asm)}px) rotate(${(r() - 0.5) * 300 * (1 - asm)}deg) scale(${1 + (1 - asm) * (r() - 0.3)})`; s.style.filter = `blur(${(1 - asm) * 8}px)`; });
  ctx.blobs.forEach((b, k) => { const r = rnd(40 + k); const sp = hide ? 1 + prog(t, 60, 61) * 3 : 1; b.style.transform = `translate(${960 + (r() - 0.5) * 1600 * sp + Math.sin(t + k) * 60}px, ${540 + (r() - 0.5) * 900 * sp + Math.cos(t * 1.2 + k) * 50}px) rotate(${t * 50}deg)`; b.style.opacity = 1 - prog(t, 60, 61.2); });
  const lp = prog(t, 60, 60.7);
  ctx.lock.style.display = hide ? "flex" : "none";
  ctx.lock.style.transform = `translate(-50%, calc(-50% - 70px)) scale(${2.2 - 1.2 * eib(lp)})`;
  ctx.lock.style.filter = `blur(${(1 - eoe(lp)) * 24}px)`;
  const tp = prog(t, 61, 61.6), cp = prog(t, 62, 62.6), fade = prog(t, 66.5, 68);
  ctx.tag.style.opacity = tp * (1 - fade); ctx.tag.style.transform = `translateY(${(1 - eoe(tp)) * 30}px)`;
  ctx.cta.style.opacity = cp * (1 - fade); ctx.cta.style.filter = `blur(${(1 - eoe(cp)) * 16}px)`;
  ctx.lock.style.opacity = 1 - fade;
});

// ------------------------------------------------------------------ master render
const stage = document.getElementById("stage"), flash = document.getElementById("flash"), scan = document.getElementById("scan");
function flashAt(t, beats, dur = 0.12, max = 1) { let a = 0; for (const b of beats) { const d = t - S(b); if (d >= 0 && d < dur) a = Math.max(a, max * (1 - d / dur)); } return a; }
function shakeAmt(t) {
  let s = 0;
  if (t >= S(5) && t < S(7.5)) s = 10;
  if (t >= S(8) && t < S(14)) s = 6 + 20 * prog(t, 8, 14);
  const hits = [16, 46, 60, 24, 28, 32, 36, 20, 21, 22, 23, 52, 53, 54];
  for (const b of hits) { const d = t - S(b); if (d >= 0 && d < 0.35) s = Math.max(s, (b === 16 || b === 46 || b === 60 ? 46 : 18) * (1 - d / 0.35)); }
  return s;
}
window.render = function (t) {
  const f = Math.round(t * 30);
  for (const sc of SCENES) { const on = t >= S(sc.b0) && t < S(sc.b1); sc.el.style.display = on ? "block" : "none"; if (on) sc.update(t, sc.ctx, f); }
  // background + leaks
  let leakI = 0.35, pal = "blue";
  if (t < S(5)) leakI = 0.25 + 0.2 * prog(t, 0, 5);
  else if (t < S(8)) leakI = 0.15;
  else if (t < S(14)) leakI = 0.25 + 0.5 * (Math.floor((t - S(8)) / S(0.5)) % 2);
  else if (t < S(16)) leakI = 0;
  else if (t < S(24)) leakI = 1.0 - 0.4 * prog(t, 16, 18);
  else if (t < S(40)) leakI = 0.45;
  else if (t < S(46)) leakI = 0.3;
  else if (t < S(56)) leakI = 0;
  else leakI = 0.5 + 0.5 * prog(t, 58, 60);
  setLeaks(t, leakI, pal);
  // shake + zoom punch
  const s = shakeAmt(t);
  const sx = (hash(f * 3) - 0.5) * 2 * s, sy = (hash(f * 5 + 1) - 0.5) * 2 * s;
  stage.style.transform = `translate(${sx}px, ${sy}px) rotate(${(hash(f * 7) - 0.5) * s * 0.04}deg)`;
  // strobe invert during the montage on some off-beats
  const k = Math.floor((t - S(8)) / S(0.25));
  stage.style.filter = t >= S(8) && t < S(14) && hash(k + 99) > 0.78 ? "invert(1) hue-rotate(180deg)" : t >= S(5) && t < S(7.5) && hash(f) > 0.93 ? "invert(1)" : "none";
  // flashes on key hits & section boundaries
  flash.style.opacity = Math.max(
    flashAt(t, [16], 0.28, 1), flashAt(t, [46, 60], 0.22, 0.9), flashAt(t, [5, 24, 28, 32, 36, 40, 48, 56], 0.1, 0.7),
    flashAt(t, [52, 53, 54], 0.08, 0.5), t >= S(15.75) && t < S(16) ? prog(t, 15.75, 16) : 0
  );
  scan.style.opacity = t >= S(5) && t < S(14) ? 0.8 : 0.25;
  drawGrain(f, t >= S(48) && t < S(56) ? 0.12 : 0.24);
};
window.ready = Promise.all([document.fonts.ready, ...["build", "tests", "execution-review", "deploy-wizard", "execution-success", "execution", "dashboard"].map((n) => new Promise((res) => { const i = new Image(); i.onload = res; i.onerror = res; i.src = `assets/${n}.png`; }))]);
</script>
</body>
